<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Countdown Display</title>
<style>
  body { margin:0; background:transparent; font-family:Arial, Helvetica, sans-serif; }

  #box{
    position:fixed;             /* <- mais confiável que absolute */
    bottom:40px; right:40px;
    background:rgba(0,0,0,0.65); color:white;
    padding:20px 28px; border-radius:10px;
    font-size:72px; font-weight:bold; letter-spacing:2px;

    display:none;
    opacity:0;
    transition: opacity 1s ease;
  }

  /* DEBUG (temporário) */
  #dbg{
    position:fixed; top:10px; left:10px;
    background:rgba(0,0,0,0.55); color:#fff;
    padding:10px 12px; border-radius:8px;
    font-size:14px; line-height:1.25; white-space:pre;
  }
</style>
</head>
<body>

<div id="box">00:00</div>
<div id="dbg">carregando…</div>

<script>
const box = document.getElementById("box");
const dbg = document.getElementById("dbg");

let finished = false;
let lastSignature = "";

function parseLocalTime(s){
  const [datePart, timePart] = s.split("T");
  const [Y,M,D] = datePart.split("-").map(Number);
  const parts = timePart.split(":").map(Number);
  const h = parts[0] ?? 0, m = parts[1] ?? 0, sec = parts[2] ?? 0;
  return new Date(Y, M-1, D, h, m, sec).getTime();
}

function fmt(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(t/60);
  const s = t%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function showFadeIn(){
  // mostra e faz fade-in SEM depender de requestAnimationFrame
  box.style.display = "block";
  box.style.opacity = "0";
  // pequeno delay para garantir que o browser aplique o display antes da transição
  setTimeout(() => {
    box.style.opacity = "1";
  }, 20);
}

function hideNow(){
  finished = false;
  box.style.display = "none";
  box.style.opacity = "0";
}

function fadeOutThenHide(){
  box.style.opacity = "0";
  setTimeout(hideNow, 1100);
}

async function tick(){
  let state;
  try{
    const res = await fetch("./state.json?t=" + Date.now(), { cache:"no-store" });
    state = await res.json();
  }catch(e){
    dbg.textContent = "ERRO lendo state.json\n" + String(e);
    return;
  }

  const sig = JSON.stringify(state);
  if (sig !== lastSignature){
    hideNow();
    lastSignature = sig;
  }

  dbg.textContent =
    "mode: " + state.mode + "\n" +
    "target_time: " + (state.target_time ?? "null") + "\n" +
    "show_when_minutes: " + (state.show_when_minutes ?? "null");

  if (state.mode !== "running" || !state.target_time) return;

  const target = parseLocalTime(state.target_time);
  const showMs = (Number(state.show_when_minutes) || 0) * 60000;
  const diff = target - Date.now();

  dbg.textContent += "\n" + "diff: " + diff + " ms (" + fmt(diff) + ")";

  box.textContent = fmt(diff);

  // ✅ ENTRA SEMPRE que estiver dentro da janela
  if (diff > 0 && diff <= showMs) {
    // se ainda está escondido, faz fade-in
    if (box.style.display === "none") showFadeIn();
  }

  // ✅ FINAL
  if (!finished && diff <= 0){
    finished = true;
    box.textContent = "00:00";
    if (box.style.display === "none") showFadeIn();
    setTimeout(fadeOutThenHide, 400);
  }
}

setInterval(tick, 300);
tick();
</script>

</body>
</html>
