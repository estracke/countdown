<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Countdown Display</title>
<style>
  body { margin:0; background:transparent; font-family:Arial, Helvetica, sans-serif; }

  #box{
    position:fixed;
    bottom:40px; right:40px;
    background:rgba(0,0,0,0.65); color:white;
    padding:20px 28px; border-radius:10px;
    font-size:72px; font-weight:bold; letter-spacing:2px;

    display:none;
    opacity:0;
    transition: opacity 1s ease;
  }
</style>
</head>
<body>

<div id="box">00:00</div>

<script>
const box = document.getElementById("box");

let finished = false;      // trava o final até um novo START
let lastMode = null;
let lastTarget = null;
let lastShow = null;

function parseLocalTime(s){
  // aceita "YYYY-MM-DDTHH:MM" ou "YYYY-MM-DDTHH:MM:SS"
  const [datePart, timePart] = s.split("T");
  const [Y,M,D] = datePart.split("-").map(Number);
  const parts = timePart.split(":").map(Number);
  const h = parts[0] ?? 0, m = parts[1] ?? 0, sec = parts[2] ?? 0;
  return new Date(Y, M-1, D, h, m, sec).getTime();
}

function fmt(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(t/60);
  const s = t%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function showFadeIn(){
  box.style.display = "block";
  box.style.opacity = "0";
  setTimeout(() => { box.style.opacity = "1"; }, 20);
}

function hideVisualOnly(){
  // ⚠️ NÃO mexe no "finished" aqui
  box.style.display = "none";
  box.style.opacity = "0";
}

function fadeOutThenHide(){
  box.style.opacity = "0";
  setTimeout(hideVisualOnly, 1100);
}

async function tick(){
  let state;
  try{
    const res = await fetch("./state.json?t=" + Date.now(), { cache:"no-store" });
    state = await res.json();
  }catch{
    return;
  }

  // Detecta NOVO START/RESET (mudança real do estado)
  const changed =
    state.mode !== lastMode ||
    state.target_time !== lastTarget ||
    state.show_when_minutes !== lastShow;

  if (changed){
    // Agora sim pode “resetar” o ciclo
    finished = false;
    hideVisualOnly();

    lastMode = state.mode;
    lastTarget = state.target_time;
    lastShow = state.show_when_minutes;
  }

  if (state.mode !== "running" || !state.target_time) {
    // se não está rodando, só garante escondido (não precisa mexer em finished aqui)
    hideVisualOnly();
    return;
  }

  // Se já finalizou e o estado não mudou, não faz mais nada (evita piscar infinito)
  if (finished) return;

  const target = parseLocalTime(state.target_time);
  const showMs = (Number(state.show_when_minutes) || 0) * 60000;
  const diff = target - Date.now();

  box.textContent = fmt(diff);

  // Fade IN quando faltar <= showWhen
  if (diff > 0 && diff <= showMs) {
    if (box.style.display === "none") showFadeIn();
  }

  // FINAL: executa UMA ÚNICA VEZ
  if (diff <= 0){
    finished = true;
    box.textContent = "00:00";

    if (box.style.display === "none") showFadeIn();

    setTimeout(() => {
      fadeOutThenHide();
    }, 400);

    return;
  }
}

setInterval(tick, 300);
tick();
</script>

</body>
</html>
