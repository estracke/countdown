<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Countdown Control</title>

<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #1e1e1e;
  color: white;
  padding: 20px;
}
label { display:block; margin-top:12px; }
input, button {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  font-size: 16px;
}
button {
  margin-top: 14px;
  border: 0;
  border-radius: 8px;
  background: #2b2b2b;
  color: white;
}
button:hover { background:#3a3a3a; }
</style>
</head>

<body>

<h2>Painel do Countdown</h2>

<label>Start em minutos</label>
<input type="number" id="minutes" placeholder="Ex: 10">

<label>OU horário alvo</label>
<input type="datetime-local" id="time">

<label>Mostrar quando faltar (minutos)</label>
<input type="number" id="show" value="3">

<button onclick="start()">START</button>
<button onclick="reset()">RESET</button>

<script>
function toLocalISOString(d){
  const pad = n => String(n).padStart(2,"0");
  return (
    d.getFullYear() + "-" +
    pad(d.getMonth()+1) + "-" +
    pad(d.getDate()) + "T" +
    pad(d.getHours()) + ":" +
    pad(d.getMinutes()) + ":" +
    pad(d.getSeconds())
  );
}

async function start() {
  const mins = Number(document.getElementById("minutes").value || 0);
  const time = document.getElementById("time").value;
  const show = Number(document.getElementById("show").value || 0);

  let target = null;

  if (time) {
    const d = new Date(time); // LOCAL
    target = toLocalISOString(d);
  } else if (mins > 0) {
    const d = new Date(Date.now() + mins * 60000);
    target = toLocalISOString(d);
  }

  if (!target) return;

  await fetch("api.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      mode: "running",
      target_time: target,
      show_when_minutes: show
    })
  });
}

async function reset() {
  await fetch("api.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      mode: "idle",
      target_time: null,
      show_when_minutes: 0
    })
  });
}
</script>

</body>
</html>
