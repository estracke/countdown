<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Countdown Display</title>

<style>
  body {
    margin:0;
    background:transparent;
    font-family: Arial, Helvetica, sans-serif;
  }

  #box{
    position:fixed;
    bottom:40px;
    left:40px;

    background:rgba(0,0,0,0.65);
    color:white;
    padding:20px 28px;
    border-radius:10px;
    font-size:72px;
    font-weight:bold;
    letter-spacing:2px;

    display:none;
    opacity:0;
    transition: opacity 1s ease;
  }
</style>
</head>

<body>

<div id="box">0:00</div>

<script src="sync-clock.js"></script>
<script>
const box = document.getElementById("box");

let finished = false;
let wasVisible = false;
let lastMode = null;
let lastTarget = null;
let lastShowSec = null;
let lastStopSignal = null;
let postedIdle = false;

/* ===== helpers ===== */
function parseLocalTime(s){
  const [datePart, timePart] = s.split("T");
  const [Y,M,D] = datePart.split("-").map(Number);
  const parts = timePart.split(":").map(Number);
  const h = parts[0] ?? 0;
  const m = parts[1] ?? 0;
  const sec = parts[2] ?? 0;
  return new Date(Y, M-1, D, h, m, sec).getTime();
}

function fmt(ms){
  const t = Math.max(0, Math.floor(ms / 1000));

  if (t >= 3600) {
    const hh = Math.floor(t / 3600);
    const mm = Math.floor((t % 3600) / 60);
    const ss = t % 60;
    return (
      String(hh).padStart(2,"0") + ":" +
      String(mm).padStart(2,"0") + ":" +
      String(ss).padStart(2,"0")
    );
  }

  const mm = Math.floor(t / 60);
  const ss = t % 60;

  if (t < 600) return `${mm}:${String(ss).padStart(2,"0")}`;
  return `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
}

function showFadeIn(){
  box.style.display = "block";
  box.style.opacity = "0";
  setTimeout(() => box.style.opacity = "1", 20);
  wasVisible = true;
}

function hideVisualOnly(){
  box.style.display = "none";
  box.style.opacity = "0";
}

function fadeOutThenHide(){
  box.style.opacity = "0";
  setTimeout(hideVisualOnly, 1100);
}

async function postIdle(stop_signal){
  try{
    await fetch("api.php", {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({
        mode: "idle",
        target_time: null,
        stop_signal: stop_signal || 0
      })
    });
  }catch{}
}

/* ===== main loop ===== */
async function tick(){
  let state;
  try{
    state = await BroadcastSync.read();
  }catch{
    return;
  }

  const showSec = Number(state.show_when_seconds);
  const canShow = Number.isFinite(showSec) && showSec > 0;

  /* STOP via painel */
  if (lastStopSignal === null) lastStopSignal = state.stop_signal ?? 0;
  if ((state.stop_signal ?? 0) !== lastStopSignal){
    lastStopSignal = state.stop_signal ?? 0;
    finished = false;
    wasVisible = false;
    postedIdle = false;
    if (box.style.display !== "none") fadeOutThenHide();
    return;
  }

  /* novo start/reset */
  const changed =
    state.mode !== lastMode ||
    state.target_time !== lastTarget ||
    state.show_when_seconds !== lastShowSec;

  if (changed){
    finished = false;
    wasVisible = false;
    postedIdle = false;
    hideVisualOnly();
    lastMode = state.mode;
    lastTarget = state.target_time;
    lastShowSec = state.show_when_seconds;
  }

  if (state.mode !== "running" || !state.target_time){
    return;
  }

  if (finished) return;

  const diff = BroadcastSync.remaining(state);

  box.textContent = fmt(diff);

  /* Fade IN quando entrar na janela (em segundos reais) */
  if (canShow && diff > 0 && diff <= showSec * 1000) {
    if (box.style.display === "none") showFadeIn();
  }

  /* FINAL */
  if (diff <= 0){
    finished = true;

    if (canShow && wasVisible){
      setTimeout(fadeOutThenHide, 400);
    }

    if (!postedIdle){
      postedIdle = true;
      // Display is read-only: BIG must remain visible at zero.
    }
  }
}

setInterval(tick, 200);
tick();
</script>

</body>
</html>
